# Board M0-12: compile the app and Live Activity for the iOS 26 simulator, and
# run the HealthCoachUITests UI tests, and take spike-screen screenshots.
#
# macOS minutes count 10x, so about 200 a month on the free plan (spending
# limit £0). To save them: pull requests only (not main, which gets the same
# squash), docs/Content/Markdown-only changes skip it, a newer push cancels
# the older run, and screenshots only run when screens change or on demand.
# CoachCore tests run on Linux (core-tests.yml). Estimate: docs/spikes/m0-12-ci.md.
# Manual runs can build an older commit (`ref`) and, with `publish_shots`, push
# the screenshots to the throwaway branch qa/gate-0a-shots for review.
name: App build

on:
  pull_request:
    paths-ignore: ["docs/**", "Content/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Take simulator screenshots"
        type: boolean
        default: true
      ref:
        description: "Commit or branch to build (blank: the branch you run from). Its own scripts are used."
        type: string
        default: ""
      publish_shots:
        description: "Also commit the screenshots to the throwaway branch qa/gate-0a-shots (never main)"
        type: boolean
        default: false

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build app (iOS 26 simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0

      - name: Record the commit built
        run: git rev-parse HEAD | tee built-sha.txt

      - name: Select the newest Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Pick an iOS 26 iPhone simulator
        id: sim
        run: echo "udid=$(.github/scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Boot the simulator in the background (en_GB, 24-hour clock)
        # Overlaps the boot with the build; the UI tests step waits for it.
        # Older commits built with the `ref` input may predate the script.
        run: |
          if [ -x .github/scripts/prepare-simulator.sh ]; then
            nohup .github/scripts/prepare-simulator.sh "${{ steps.sim.outputs.udid }}" > sim-prepare.log 2>&1 &
          else
            touch sim-ready
          fi

      - name: Cache exercise GIFs
        uses: actions/cache@v4
        with:
          path: Content/exercises/media
          key: exercise-gifs-${{ hashFiles('Content/exercises/exercises.json') }}
          restore-keys: exercise-gifs-

      - name: Fetch exercise GIFs into the bundle (never fetched at runtime)
        run: scripts/fetch-exercise-gifs.sh

      - name: Build app, Live Activity and UI tests (signing off)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project HealthCoach.xcodeproj \
            -scheme HealthCoach \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|warning:|\*\* .* (SUCCEEDED|FAILED) \*\*" || true
          grep -q "TEST BUILD SUCCEEDED" xcodebuild.log
          test -d build/Build/Products/Debug-iphonesimulator/HealthCoach.app/PlugIns/LiveActivity.appex
          if [ -d Content/programmes ] && grep -q "Content in Resources" HealthCoach.xcodeproj/project.pbxproj; then
            test -f build/Build/Products/Debug-iphonesimulator/HealthCoach.app/Content/exercises/exercises.json
            test -f build/Build/Products/Debug-iphonesimulator/HealthCoach.app/Content/programmes/phase-1.json
          fi

      - name: UI tests (HealthCoachUITests)
        # CoachCore unit tests run on Linux (core-tests.yml), so only the UI tests run here.
        # Older commits built with the `ref` input may predate the UI test target.
        if: hashFiles('HealthCoachUITests/**') != ''
        run: |
          set -o pipefail
          if [ -x .github/scripts/wait-simulator.sh ]; then .github/scripts/wait-simulator.sh; fi
          xcodebuild test-without-building \
            -project HealthCoach.xcodeproj \
            -scheme HealthCoach \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -only-testing:HealthCoachUITests \
            -resultBundlePath ui-tests.xcresult \
            | tee uitests.log | grep -E "Test (Case|Suite).*(passed|failed)|error:|\*\* TEST" || true
          grep -q "\*\* TEST EXECUTE SUCCEEDED \*\*" uitests.log

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-xcresult
          path: ui-tests.xcresult
          retention-days: 14
          if-no-files-found: ignore

      - name: Decide on screenshots
        id: shots
        # Manual runs: the input. PRs: only when screens or the screenshot recipe change.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "take=${{ inputs.screenshots }}" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
               | grep -qE '^(App|LiveActivity|Shared)/|^\.github/(scripts/screenshots\.sh|workflows/app\.yml)$'; then
            echo "take=true" >> "$GITHUB_OUTPUT"
          else
            echo "take=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Simulator screenshots
        if: steps.shots.outputs.take == 'true'
        run: |
          if [ -x .github/scripts/wait-simulator.sh ]; then .github/scripts/wait-simulator.sh; fi
          .github/scripts/screenshots.sh "${{ steps.sim.outputs.udid }}" build/Build/Products/Debug-iphonesimulator/HealthCoach.app screenshots

      - name: Upload screenshots
        if: always() && steps.shots.outputs.take == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: |
            screenshots/
            built-sha.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            uitests.log
          retention-days: 7
          if-no-files-found: ignore

  # Manual runs with publish_shots only: put the screenshots on a throwaway
  # branch so reviewers can open them in the browser. Only this job can write,
  # and it only ever pushes qa/gate-0a-shots.
  publish-shots:
    name: Publish screenshots to qa/gate-0a-shots
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_shots && inputs.screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simulator-screenshots
          path: shots

      - name: Commit to qa/gate-0a-shots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          sha="$(cat shots/built-sha.txt)"
          git init -q pub && cd pub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan qa/gate-0a-shots
          mkdir screenshots && cp ../shots/screenshots/*.png screenshots/
          {
            echo "# Gate 0a screenshots"
            echo
            echo "Built from \`$sha\` by run ${{ github.run_id }}. Throwaway branch: never merge it."
            echo
            for f in screenshots/*.png; do echo "## $(basename "$f" .png)"; echo; echo "![]($f)"; echo; done
          } > README.md
          git add -A
          git commit -q -m "Gate 0a screenshots from $sha (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/qa/gate-0a-shots
          echo "https://github.com/${REPO}/tree/qa/gate-0a-shots" >> "$GITHUB_STEP_SUMMARY"
